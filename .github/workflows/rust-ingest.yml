name: rust ingest

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
    paths:
      - 'ingest/**'
      - 'packages/hone-contracts/src/**'
      - 'packages/hone-contracts/composer.*'
      - 'packages/hone-server/src/**'
      - 'packages/hone-server/routes/**'
      - 'packages/hone-server/database/**'
      - 'packages/hone-server/config/**'
      - 'packages/hone-server/tests/**'
      - 'packages/hone-server/composer.*'
      - 'packages/hone-server/phpunit.xml'
      - '.github/workflows/rust-ingest.yml'
      - 'composer.*'
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos
    paths:
      - 'ingest/**'
      - 'packages/hone-contracts/src/**'
      - 'packages/hone-contracts/composer.*'
      - 'packages/hone-server/src/**'
      - 'packages/hone-server/routes/**'
      - 'packages/hone-server/database/**'
      - 'packages/hone-server/config/**'
      - 'packages/hone-server/tests/**'
      - 'packages/hone-server/composer.*'
      - 'packages/hone-server/phpunit.xml'
      - '.github/workflows/rust-ingest.yml'
      - 'composer.*'

permissions:
  contents: read

jobs:
  rust-ingest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_DB: hone_rust_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgres://root@127.0.0.1:5432/hone_rust_test

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Select stable Rust
        run: rustup default stable

      - name: Cache Cargo registry and build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ingest/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('ingest/Cargo.lock', 'ingest/Cargo.toml') }}-${{ hashFiles('ingest/src/**') }}
          restore-keys: |
            ${{ runner.os }}-cargo-${{ hashFiles('ingest/Cargo.lock', 'ingest/Cargo.toml') }}-

      - name: Setup PHP for live ingest parity
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.4'
          extensions: pdo_pgsql, mbstring, sodium
          tools: composer:v2
          coverage: none

      - name: Install Hone Server testbench dependencies
        run: composer --working-dir=packages/hone-server install --no-interaction --prefer-dist

      - name: Preflight required live parity prerequisites
        run: |
          command -v cargo
          cargo --version
          rustc --version
          pg_isready -h 127.0.0.1 -p 5432 -U root -d hone_rust_test
          createdb -h 127.0.0.1 -p 5432 -U root hone_server_test
          php -r 'exit(extension_loaded("pdo_pgsql") ? 0 : 1);'

      - name: Check formatting
        run: cargo fmt --manifest-path ingest/Cargo.toml --check

      - name: Run Clippy
        run: cargo clippy --locked --manifest-path ingest/Cargo.toml --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --locked --manifest-path ingest/Cargo.toml --all-targets --all-features

      # The ordinary package test script excludes this slower live consumer rung.
      # This explicit step fails on missing prerequisites, any skip, or an empty group.
      - name: Compare real PHP and Rust HTTP ingest persistence
        run: composer --working-dir=packages/hone-server test:parity -- --compact
