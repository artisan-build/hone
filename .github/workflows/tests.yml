name: tests

on:
  push:
    branches:
      - develop
      - main
      - master
      - workos
  pull_request:
    branches:
      - develop
      - main
      - master
      - workos

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ['8.5']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: root
          POSTGRES_DB: hone_app_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer:v2
          coverage: xdebug

      - name: Add Flux Credentials Loaded From ENV
        run: composer config http-basic.composer.fluxui.dev "${{ secrets.FLUX_USERNAME }}" "${{ secrets.FLUX_LICENSE_KEY }}"

      - name: Install Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Audit Dependencies
        run: composer audit

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Create Hone Server Test Database
        run: createdb -h 127.0.0.1 -p 5432 -U root hone_server_test

      - name: Run Rector
        run: composer rector:check

      - name: Run PHPStan
        run: composer stan

      - name: Run Tests
        run: ./vendor/bin/pest

      - name: Run Hone Server Package Tests
        run: cd packages/hone-server && composer install --no-interaction --prefer-dist && composer lint:test && composer test

  lowest-deps:
    name: tests (lowest deps) / Laravel ${{ matrix.laravel-major }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/hone-client
    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel-major: 11
            illuminate: 11.36.0
            testbench: ^9.7
            pest: ^3.0
            composer-update-arguments: --ignore-platform-req=php+
          - laravel-major: 12
            illuminate: ^12.0
            testbench: ^10.0
            pest: ^3.0
            composer-update-arguments: ''
          - laravel-major: 13
            illuminate: ^13.0
            testbench: ^11.0
            pest: ^4.0
            composer-update-arguments: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Pin Laravel test matrix
        run: |
          composer require --no-update \
            "illuminate/console:${{ matrix.illuminate }}" \
            "illuminate/contracts:${{ matrix.illuminate }}" \
            "illuminate/filesystem:${{ matrix.illuminate }}" \
            "illuminate/http:${{ matrix.illuminate }}" \
            "illuminate/log:${{ matrix.illuminate }}" \
            "illuminate/support:${{ matrix.illuminate }}" \
            "laravel/framework:${{ matrix.illuminate }}"
          composer require --dev --no-update \
            "orchestra/testbench:${{ matrix.testbench }}" \
            "pestphp/pest:${{ matrix.pest }}"
          composer config audit.block-insecure false

      - name: Install lowest dependencies
        run: composer update --prefer-lowest --prefer-stable -W --no-interaction ${{ matrix.composer-update-arguments }}

      - name: Show resolved Laravel version
        run: composer show laravel/framework

      - name: Run Hone Client package tests
        run: composer test -- --colors=never
